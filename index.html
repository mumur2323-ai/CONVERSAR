<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Conversar</title>
  <style>
    body {
      background: #0f0f0f;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat {
      width: 100%;
      max-width: 420px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
    }

    .msg {
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .bot {
      color: #9ad1ff;
    }

    .user {
      text-align: right;
      color: #caffbf;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: white;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .exit {
      margin-top: 8px;
      background: transparent;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="chat" id="chat">
  <div class="msg bot">Oi. Posso te fazer uma pergunta rápida?</div>
</div>

<input id="input" placeholder="Digite aqui…" />
<button onclick="send()">Enviar</button>
<button class="exit" onclick="exitChat()">Sair a qualquer momento</button>

<script>
const apiKey = "AIzaSyA8rMaI6ikLtjM6ibcBLU5U9y2jYC1k6U8";
let step = 0;

const perguntas = [
  "Ultimamente, sua mente anda mais acelerada ou mais cansada?",
  "O que mais tem pesado pra você nesses dias?",
  "Você sente que consegue falar disso com alguém?",
  "Quer continuar conversando ou prefere parar por aqui?"
];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";

  if (step < perguntas.length) {
    chat.innerHTML += `<div class="msg bot">${perguntas[step]}</div>`;
    step++;
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  // Resposta com IA (estilo humano)
  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + apiKey,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Responda como uma pessoa real, acolhedora, sem parecer robô. Mensagem do usuário: ${text}`
          }]
        }]
      })
    }
  );

  const data = await response.json();
  const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Entendo.";

  chat.innerHTML += `<div class="msg bot">${reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

function exitChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML += `<div class="msg bot">Tudo bem. Se quiser voltar, estarei por aqui.</div>`;
}
</script>

</body>
</html>
